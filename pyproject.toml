[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanos-shorts-factory"
version = "0.1.0"
description = "HUMANOS Shorts Factory — milestone 1: long video → transcript + SRT"
readme = "shorts_factory/README.md"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper>=1.0.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
humanos = "shorts_factory.cli:main"

[tool.setuptools.packages.find]
include = ["shorts_factory*"]

[tool.setuptools.package-data]
shorts_factory = ["py.typed"]
