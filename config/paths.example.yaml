# HUMANOS path config (SF7) — copy/adapt per machine; do not hardcode Windows paths in code.
# Override any key with env vars (see shorts_factory/config.py) or CLI flags.
#
# Working path reference (Jota): C:\Workspace\Projects\humanos
# Cloud / other machines: resolve from repo root / cwd — never bake absolute paths here as secrets.

repo_root: null                 # null = auto-detect from package location; or set HUMANOS_ROOT
input_media: null               # optional default directory for source videos; CLI path wins
outputs: outputs/shorts_factory # relative to repo_root unless absolute
ffmpeg: null                    # null = resolve from PATH; or absolute path to ffmpeg binary
asr_models: null                # optional faster-whisper model cache dir
davinci_path: null              # future — not used in milestone 1

transcription:
  backend: faster_whisper
  model: small                  # locked default (Q2 closed): tiny|base|small|medium|large-v3|…
  language: auto                # auto | es | en | …
  device: auto                  # auto | cpu | cuda
  compute_type: auto            # auto | int8 | float16 | float32 | …
